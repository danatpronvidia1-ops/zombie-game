<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie: Save or Death</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="your_background.jpg">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { margin:0; padding:0; background:#000; color:#fff; font-family:sans-serif; text-align:center;
               background-image:url('your_background.jpg'); background-position:center; background-size:contain; background-repeat:no-repeat; height:100vh; overflow:hidden; }
        h1 { color:#e61919; font-size:28px; margin:0; padding-top:20px; text-shadow: 0 0 10px rgba(230,25,25,0.5); }
        
        #game-screen { display:none; opacity:0; transition: opacity 0.5s ease; }
        .tables { display:flex; justify-content:space-around; margin-top:20px; padding:10px; }
        .column { width:32%; background:rgba(15,15,15,0.9); padding:10px; border-radius:8px; min-height:300px; border: 1px solid #222; }
        .column h3 { margin:5px 0; font-size:16px; letter-spacing: 1px; }
        .survivors h3 { color:#32cd32; text-shadow: 0 0 5px rgba(50,205,50,0.3); } 
        .caught h3 { color:#ff8c00; text-shadow: 0 0 5px rgba(255,140,0,0.3); } 
        .dead h3 { color:#808080; }
        .p-block { background:#222; padding:12px; margin:8px 0; border-radius:5px; font-weight:bold; font-size:15px; border-left: 4px solid #444; text-align:left; padding-left:15px; }
        .survivors .p-block { border-left-color: #32cd32; }
        .caught .p-block { border-left-color: #ff8c00; }
        .dead .p-block { border-left-color: #555; opacity:0.5; }
        
        /* СТАРТОВОЕ ОКНО В СТИЛЕ CS:GO */
        #start-overlay { position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(10,10,10,0.95); 
                          backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
                          z-index:10000; display:flex; justify-content:center; align-items:center; flex-direction:column; }
        .logo-title { color:#fff; font-size:32px; font-weight:bold; margin-bottom:10px; letter-spacing:2px; }
        .logo-subtitle { color:#888; font-size:16px; margin-bottom:40px; }
        
        /* Кнопка ПРИНЯТЬ как в CS:GO */
        .btn-start { padding:22px 60px; font-size:26px; font-weight:bold; background:#4caf50; color:#fff; 
                     border:2px solid #388e3c; border-radius:5px; cursor:pointer; 
                     box-shadow: 0 0 25px rgba(76,175,80,0.4); transition: all 0.2s ease; text-transform: uppercase; }
        .btn-start:active { transform: scale(0.95); box-shadow: 0 0 10px rgba(76,175,80,0.6); background:#388e3c; }

        #alarm-screen { display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:#700; z-index:9999; justify-content:center; align-items:center; flex-direction:column; }
        #alarm-screen h2 { font-size:32px; color:#fff; margin-bottom:30px; animation: blink 0.8s infinite; text-shadow: 0 0 10px #000; }
        .btn-accept { padding:20px 40px; font-size:22px; font-weight:bold; background:#32cd32; color:#fff; border:none; border-radius:10px; cursor:pointer; box-shadow: 0 0 15px #32cd32; }
        @keyframes blink { 0% { opacity:1; } 50% { opacity:0.2; } 100% { opacity:1; } }
    </style>
</head>
<body>

    <!-- СТАРТОВЫЙ ЭКРАН ИГРЫ -->
    <div id="start-overlay">
        <div class="logo-title">ИГРА НАЙДЕНА!</div>
        <div class="logo-subtitle">ZOMBIE: SAVE OR DEATH</div>
        <button class="btn-start" onclick="startGame()">ПРИНЯТЬ ИГРУ</button>
    </div>

    <!-- ОСНОВНОЙ ИНТЕРФЕЙС ИГРЫ -->
    <div id="game-screen">
        <h1>ZOMBIE: SAVE OR DEATH</h1>
        <div class="tables">
            <div class="column survivors"><h3>SURVIVORS</h3><div id="survivors-list"></div></div>
            <div class="column caught"><h3>CAUGHT</h3><div id="caught-list"></div></div>
            <div class="column dead"><h3>DEAD</h3><div id="dead-list"></div></div>
        </div>
    </div>

    <div id="alarm-screen">
        <h2 id="alarm-text">ТЕБЯ ПОЙМАЛИ!</h2>
        <button class="btn-accept" onclick="stopAlarm()">ПРИНЯТЬ ЗАРАЖЕНИЕ</button>
    </div>

    <!-- АУДИО ТРЕКИ -->
    <audio id="csgo-sound" src="csgo_accept.mp3" autoplay></audio>
    <audio id="menu-music" src="menu.mp3"></audio>
    <audio id="alert-sound" src="Alert.mp3" loop></audio>

    <script>
        const socket = io();
        const csgoSound = document.getElementById('csgo-sound');
        const menuMusic = document.getElementById('menu-music');
        const alertSound = document.getElementById('alert-sound');

        // Пытаемся воспроизвести звук CS:GO сразу при загрузке
        window.addEventListener('DOMContentLoaded', () => {
            csgoSound.play().catch(e => {
                // Если браузер заблокировал автозвук, пустим его при первом шевелении пальцем по экрану
                document.body.addEventListener('touchstart', () => { csgoSound.play(); }, { once: true });
                document.body.addEventListener('click', () => { csgoSound.play(); }, { once: true });
            });
        });

        // КЛИК ПО КНОПКЕ ПРИНЯТЬ
        function startGame() {
            // Останавливаем звук CS:GO, если он ещё играл
            csgoSound.pause();
            
            // Включаем главную песню меню
            menuMusic.play().catch(e => console.log(e));
            
            // ПОЛНОСТЬЮ УДАЛЯЕМ стартовую кнопку и окно с экрана, чтобы они исчезли
            const overlay = document.getElementById('start-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.remove(); }, 500); // Удаляем элемент из кода сайта
            
            // Открываем таблицы игры
            const gameScreen = document.getElementById('game-screen');
            gameScreen.style.display = 'block';
            setTimeout(() => { gameScreen.style.opacity = '1'; }, 50);
        }

        socket.on('update_all_players', (players) => {
            document.getElementById('survivors-list').innerHTML = '';
            document.getElementById('caught-list').innerHTML = '';
            document.getElementById('dead-list').innerHTML = '';
            for (let name in players) {
                const status = players[name];
                const div = document.createElement('div');
                div.className = 'p-block';
                div.innerText = name;
                document.getElementById(`${status}-list`).appendChild(div);
            }
        });

        socket.on('play_network_sound', (data) => {
            menuMusic.pause();
            alertSound.currentTime = 0;
            alertSound.play().catch(e => console.log(e));
            document.getElementById('alarm-text').innerText = data.message;
            document.getElementById('alarm-screen').style.display = 'flex';
            if('vibrate' in navigator) navigator.vibrate();
        });

        function stopAlarm() {
            alertSound.pause();
            document.getElementById('alarm-screen').style.display = 'none';
            menuMusic.play().catch(e => console.log(e));
        }

        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
    </script>
</body>
</html>
