<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie: Save or Death</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://socket.io"></script>
    <style>
        body { margin:0; padding:0; background:#000; color:#fff; font-family:sans-serif; text-align:center;
               background-image:url('your_background.jpg'); background-position:center; background-size:contain; background-repeat:no-repeat; height:100vh; }
        h1 { color:#e61919; font-size:24px; margin:0; padding-top:20px; }
        .tables { display:flex; justify-content:space-around; margin-top:20px; padding:10px; }
        .column { width:30%; background:rgba(20,20,20,0.85); padding:10px; border-radius:8px; min-height:250px; }
        .column h3 { margin:5px 0; font-size:14px; }
        .survivors h3 { color:#32cd32; } .caught h3 { color:#ff8c00; } .dead h3 { color:#808080; }
        .p-block { background:#333; padding:10px; margin:5px 0; border-radius:5px; font-weight:bold; font-size:14px; }
        
        /* Экран звонка поверх всего */
        #alarm-screen { display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:#900; z-index:9999; justify-content:center; align-items:center; flex-direction:column; }
        #alarm-screen h2 { font-size:32px; color:#fff; margin-bottom:30px; animation: blink 1s infinite; }
        .btn-accept { padding:20px 40px; font-size:22px; font-weight:bold; background:#00ff00; color:#000; border:none; border-radius:10px; cursor:pointer; }
        @keyframes blink { 0% { opacity:1; } 50% { opacity:0.3; } 100% { opacity:1; } }
    </style>
</head>
<body>
    <h1>ZOMBIE: SAVE OR DEATH</h1>
    <div class="tables">
        <div class="column survivors"><h3>SURVIVORS</h3><div id="survivors-list"></div></div>
        <div class="column caught"><h3>CAUGHT</h3><div id="caught-list"></div></div>
        <div class="column dead"><h3>DEAD</h3><div id="dead-list"></div></div>
    </div>

    <div id="alarm-screen">
        <h2 id="alarm-text">ТЕБЯ ПОЙМАЛИ!</h2>
        <button class="btn-accept" onclick="stopAlarm()">ПРИНЯТЬ ЗАРАЖЕНИЕ</button>
    </div>

    <audio id="menu-music" src="меню.mp3" loop></audio>
    <audio id="alert-sound" src="Alert.mp3" loop></audio>

    <script>
        const socket = io();
        const menuMusic = document.getElementById('menu-music');
        const alertSound = document.getElementById('alert-sound');

        document.body.addEventListener('click', () => {
            if (menuMusic.paused) menuMusic.play().catch(e => console.log(e));
        }, { once: true });

        socket.on('update_all_players', (players) => {
            document.getElementById('survivors-list').innerHTML = '';
            document.getElementById('caught-list').innerHTML = '';
            document.getElementById('dead-list').innerHTML = '';
            for (let name in players) {
                const status = players[name];
                const div = document.createElement('div');
                div.className = 'p-block';
                div.innerText = name;
                document.getElementById(`${status}-list`).appendChild(div);
            }
        });

        socket.on('play_network_sound', (data) => {
            menuMusic.pause();
            alertSound.currentTime = 0;
            alertSound.play().catch(e => console.log(e));
            document.getElementById('alarm-text').innerText = data.message;
            document.getElementById('alarm-screen').style.display = 'flex';
            if('vibrate' in navigator) navigator.vibrate([500, 500, 500]);
        });

        function stopAlarm() {
            alertSound.pause();
            document.getElementById('alarm-screen').style.display = 'none';
            menuMusic.play().catch(e => console.log(e));
        }

        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
    </script>
</body>
</html>
