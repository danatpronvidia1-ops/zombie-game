<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель Зомби Мастера</title>
    <link rel="apple-touch-icon" href="your_background.jpg">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { margin: 0; background: #111; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        h1 { color: #ff3333; font-size: 24px; }
        .box { background: #222; padding: 15px; margin: 10px auto; max-width: 500px; border-radius: 8px; border: 1px solid #333; }
        input { padding: 12px; font-size: 16px; width: 55%; border-radius: 5px; border: 1px solid #444; background: #333; color: #fff; }
        textarea { padding: 12px; font-size: 14px; width: 90%; height: 60px; border-radius: 5px; border: 1px solid #444; background: #333; color: #fff; margin-top: 10px; font-family: sans-serif; resize: none; }
        button { padding: 12px 15px; font-size: 16px; font-weight: bold; background: #007bff; color: #fff; border: none; border-radius: 5px; margin-left: 5px; cursor: pointer; }
        .btn-zone { background: #ff8c00; margin-top: 10px; width: 95%; }
        .list { margin-top: 20px; text-align: left; max-width: 500px; margin: 20px auto; }
        .p-item { display: flex; justify-content: space-between; background: #2a2a2a; padding: 10px; margin: 5px 0; border-radius: 5px; align-items: center; }
        .p-info { display: flex; flex-direction: column; }
        .p-name { font-weight: bold; font-size: 16px; }
        .p-sub { font-size: 12px; color: #888; margin-top: 4px; }
        .xp-btn { padding: 2px 8px; font-size: 12px; background: #444; margin-left: 3px; border-radius: 3px; display: inline-block; color:#fff; border:none; cursor: pointer; }
        .btn-catch { background: #ff8c00; padding: 8px 12px; font-size: 13px; font-weight:bold; border-radius: 5px; color:#fff; border:none; cursor: pointer; }
        .btn-dead { background: #555; padding: 8px 12px; font-size: 13px; font-weight:bold; border-radius: 5px; color:#fff; border:none; cursor: pointer; }
        .clear-panel { margin-top: 40px; padding: 10px; }
        .btn-clear { background: #28a745; width: 100%; max-width: 500px; padding: 15px; font-size: 18px; border-radius: 8px; color:#fff; border:none; cursor: pointer; margin-bottom: 10px; }
        .btn-reset-all { background: #dc3545; width: 100%; max-width: 500px; padding: 10px; font-size: 14px; border-radius: 8px; color:#fff; border:none; cursor: pointer; opacity: 0.7; }
    </style>
</head>
<body>
    <h1>ПАНЕЛЬ УПРАВЛЕНИЯ ИГРОЙ</h1>
    
    <!-- НАСТРОЙКА УВЕДОМЛЕНИЙ DANGER ZONE -->
    <div class="box">
        <h3>Уведомление Danger Zone (Сужение)</h3>
        <textarea id="zone-text" placeholder="Например: Сзади коричневого дома нельзя!"></textarea>
        <button class="btn-zone" onclick="saveZoneText()">📢 ОБНОВИТЬ И ОТПРАВИТЬ ПРАВИЛО ЗОНЫ</button>
    </div>

    <div class="box">
        <input type="text" id="p-name" placeholder="Имя друга...">
        <button onclick="addFriend()">ДОБАВИТЬ</button>
    </div>
    <div class="list" id="players-list"></div>

    <div class="clear-panel">
        <button class="btn-clear" onclick="clearAll()">🔁 СЛЕДУЮЩИЙ РАУНД (ВЫЖИВШИМ +2 XP)</button>
        <button class="btn-reset-all" onclick="resetDatabase()">⚠️ ПОЛНОЕ ОБНУЛЕНИЕ ВСЕЙ СТАТИСТИКИ</button>
    </div>

    <script>
        const socket = io();
        function addFriend() {
            const name = document.getElementById('p-name').value.trim();
            if(name) { socket.emit('add_player', { name: name }); document.getElementById('p-name').value = ''; }
        }
        function saveZoneText() {
            const txt = document.getElementById('zone-text').value.trim();
            if(txt) { socket.emit('set_zone_text', { text: txt }); alert("Правило зоны обновлено у всех ребят!"); }
        }
        function move(name, status) { socket.emit('move_player', { name: name, status: status }); }
        function changeXP(name, amount) { socket.emit('change_player_xp', { name: name, amount: amount }); }
        function clearAll() { if(confirm("Начать новый раунд?")) { socket.emit('clear_all_players'); } }
        function resetDatabase() { if(confirm("Полностью стереть всю историю побед?")) { socket.emit('reset_entire_database'); } }

        socket.on('update_zone_text', (text) => { document.getElementById('zone-text').value = text; });

        socket.on('update_all_players', (players) => {
            const list = document.getElementById('players-list');
            list.innerHTML = '';
            for(let name in players) {
                const pData = players[name];
                const status = pData.status;
                const xp = pData.xp || 0;

                const div = document.createElement('div');
                div.className = 'p-item';
                div.innerHTML = `
                    <div class="p-info">
                        <strong class="p-name">${name}</strong>
                        <span class="p-sub">XP: ${xp} 
                            <button class="xp-btn" onclick="changeXP('${name}', 5)">+5</button>
                            <button class="xp-btn" onclick="changeXP('${name}', -5)">-5</button>

                            | В: ${pData.survivedCount || 0} П: ${pData.caughtCount || 0}
                        </span>
                    </div>
                `;
                
                if(status === 'survivors') {
                    div.innerHTML += `<button class="btn-catch" onclick="move('${name}', 'caught')">ПОЙМАН (-5 XP)</button>`;
                } else if(status === 'caught') {
                    div.innerHTML += `<button class="btn-dead" onclick="move('${name}', 'dead')">МЕРТВ</button>`;
                }
                list.appendChild(div);
            }
        });
    </script>
</body>
</html>
